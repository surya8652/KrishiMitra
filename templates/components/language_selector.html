<!-- Language Selector Component -->
<div class="lang-dropdown" id="langDropdown" style="position:relative;display:inline-block;">
  <button type="button" onclick="document.getElementById('langDropdown').classList.toggle('open')"
    class="inline-flex items-center gap-1.5 cursor-pointer"
    style="border-radius:0.5rem;border:1px solid #D1D5DB;background:#fff;padding:0.375rem 0.625rem;font-size:0.875rem;font-weight:500;color:#374151;"
    aria-label="Select language">
    <i data-lucide="globe" style="width:1rem;height:1rem;color:#1B5E20;"></i>
    <span style="font-weight:600;">
      {% for l in supported_languages %}{% if l.code == lang %}{{ l.nativeName }}{% endif %}{% endfor %}
    </span>
    <i data-lucide="chevron-down" style="width:0.875rem;height:0.875rem;color:#9CA3AF;"></i>
  </button>

  <div class="lang-dropdown-menu" style="padding:0.5rem;">
    <p style="padding:0.25rem 0.5rem;font-size:0.75rem;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:0.05em;">
      Choose Language / भाषा निवडा
    </p>
    {% for l in supported_languages %}
    <form method="POST" action="{{ url_for('api_set_language') }}" style="margin:0;">
      <input type="hidden" name="language" value="{{ l.code }}" />
      <button type="submit" class="lang-dropdown-item {{ 'active' if l.code == lang else '' }}">
        <div style="display:flex;flex-direction:column;text-align:left;">
          <span style="font-weight:500;font-size:1rem;">{{ l.nativeName }}</span>
          <span style="font-size:0.75rem;color:#9CA3AF;">{{ l.label }}</span>
        </div>
        {% if l.code == lang %}
        <i data-lucide="check" style="width:1rem;height:1rem;color:#1B5E20;"></i>
        {% endif %}
      </button>
    </form>
    {% endfor %}
  </div>
</div>

<script>
// Close language dropdown when clicking outside
document.addEventListener('click', function(e) {
  var dd = document.getElementById('langDropdown');
  if (dd && !dd.contains(e.target)) {
    dd.classList.remove('open');
  }
});
</script>
